name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Report logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run report logic test suite
        run: npm test

      - name: Basic HTML sanity check
        run: |
          node -e "
            const fs = require('fs');
            const src = fs.readFileSync('index.html', 'utf8');
            const openScripts = (src.match(/<script\\b[^>]*>/g) || []).length;
            const closeScripts = (src.match(/<\/script>/g) || []).length;
            if (openScripts !== closeScripts) {
              console.error('Mismatched <script> tags:', openScripts, 'open vs', closeScripts, 'close');
              process.exit(1);
            }
            console.log('index.html script-tag balance OK (' + openScripts + ' script blocks)');
          "
